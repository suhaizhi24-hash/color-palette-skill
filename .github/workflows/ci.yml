name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Windows hosted runners redirect Python stdout through cp1252 by default.
  # Every official command emits Chinese, so keep the full workflow on UTF-8.
  PYTHONUTF8: "1"

jobs:
  core:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install minimal privacy-scan dependency
        run: python -m pip install --upgrade pip "Pillow>=10.0"

      - name: Privacy scan of checkout
        env:
          PYTHONPATH: src
        run: python tools/privacy_scan.py . --output privacy_scan.json

      # Font discovery is interpreter-independent. Exercise the installed CJK
      # path once and keep 3.10/3.13 on the required no-font fallback path.
      - name: Install CJK font on Ubuntu
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Compile Python source
        run: python -m compileall -q src tests tools scripts

      - name: Verify OpenCV 4.x compatibility contract
        run: >-
          python -c "import cv2;
          major,minor=map(int,cv2.__version__.split('.')[:2]);
          print('OpenCV', cv2.__version__);
          assert major==4 and minor>=14,
          f'V0.14.x requires OpenCV >=4.14,<5, got {cv2.__version__}'"

      - name: Validate Lighting A-F benchmark registry
        run: >-
          python scripts/run_lighting_benchmark.py --manifest-only
          --output lighting_benchmark_registry.json

      - name: Validate JSON Schema
        run: python tools/validate_schemas.py .

      - name: Run pytest
        run: python -m pytest

      - name: Privacy scan after tests
        run: python tools/privacy_scan.py . --output privacy_scan.json

      - name: Run local environment doctor
        run: color-palette-doctor --output doctor.json

      - name: Validate light/effect public dataset
        run: >-
          python tools/validate_light_effect_dataset.py
          --root .
          --output light_effect_validation.json

      - name: Build wheel
        run: python -m build --wheel

      - name: Audit built wheel
        run: >-
          python tools/audit_wheel.py dist
          --expected-version 0.14.1
          --output wheel_audit.json

      - name: Build Codex experience kit
        if: matrix.python-version == '3.12'
        run: >-
          python tools/build_codex_kit.py dist
          --output dist/color-palette-codex-kit-v0.14.1.zip
          --result codex_kit_build.json

      - name: Verify Codex kit clean install and portable paths
        if: matrix.python-version == '3.12'
        run: >-
          python tools/verify_codex_kit.py
          dist/color-palette-codex-kit-v0.14.1.zip
          --schema schemas/analysis.schema.json
          --result codex_kit_smoke.json

      - name: Clean virtual environment Wheel install and CLI smoke
        run: >-
          python tools/clean_wheel_smoke.py dist
          --input examples/public/synthetic_srgb_icc.png
          --schema schemas/analysis.schema.json
          --output ci_output
          --result clean_wheel_smoke.json

      - name: Verify tracked files unchanged
        run: git diff --exit-code

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            dist/*.whl
            dist/color-palette-codex-kit-v0.14.1.zip
            doctor.json
            privacy_scan.json
            light_effect_validation.json
            lighting_benchmark_registry.json
            wheel_audit.json
            clean_wheel_smoke.json
            codex_kit_build.json
            codex_kit_smoke.json
            ci_output/
          if-no-files-found: ignore

  optional-dlib:
    name: Optional dlib backend / Ubuntu / Python 3.12
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The hosted Ubuntu image already includes CMake and build tools. Keep
      # this optional enhancement independent from transient apt mirrors; the
      # dlib face-backend tests do not render CJK reports.
      - name: Verify hosted CMake toolchain
        run: cmake --version
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,face-dlib]"
      - run: pytest tests/test_face_detection.py tests/test_face_backends.py
      - run: color-palette-doctor --output dlib_doctor.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optional-dlib-diagnostics
          path: dlib_doctor.json
          if-no-files-found: ignore
