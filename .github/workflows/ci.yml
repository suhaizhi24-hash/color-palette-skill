name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CJK font on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install package and development tools
        run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - name: Privacy scan of checkout
        run: python tools/privacy_scan.py . --output privacy_scan.json

      - name: Compile Python source
        run: python -m compileall -q src tests tools

      - name: Validate JSON Schema
        run: python tools/validate_schemas.py .

      - name: Run pytest
        run: python -m pytest

      - name: Privacy scan after tests
        run: python tools/privacy_scan.py . --output privacy_scan.json

      - name: Run local environment doctor
        run: color-palette-doctor --output doctor.json

      - name: Validate light/effect public dataset
        run: >-
          python tools/validate_light_effect_dataset.py
          --root .
          --output light_effect_validation.json

      - name: Build wheel
        run: python -m build --wheel

      - name: Audit built wheel
        run: >-
          python tools/audit_wheel.py dist
          --expected-version 0.12.0
          --output wheel_audit.json

      - name: Install built wheel without dependency download
        run: >-
          python -c "import glob,subprocess,sys;
          wheel=glob.glob('dist/*.whl')[0];
          subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',wheel])"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Wheel CLI smoke test
        run: >-
          color-palette examples/public/synthetic_srgb_icc.png
          --output ci_output
          --face-backend none

      - name: Verify installed wheel and PNG-only output
        run: >-
          python -c "from pathlib import Path; import importlib.metadata,json;
          from PIL import Image; from jsonschema import Draft202012Validator;
          p=Path('ci_output'); files=sorted(p.iterdir());
          assert importlib.metadata.version('color-palette-skill')=='0.12.0';
          assert sorted(x.suffix.lower() for x in files)==['.json','.png'];
          analysis=next(p.glob('*_analysis.json')); report=next(p.glob('*_color_report.png'));
          data=json.loads(analysis.read_text(encoding='utf-8'));
          schema=json.loads(Path('schemas/analysis.schema.json').read_text(encoding='utf-8'));
          Draft202012Validator(schema).validate(data);
          assert data['zero_token'] is True and data['render_policy']['generate_jpg'] is False;
          image=Image.open(report); assert image.format=='PNG' and image.size==(1600,1200);
          assert not list(p.glob('*.jpg')) and not list(p.glob('*.jpeg'))"

      - name: Verify tracked files unchanged
        run: git diff --exit-code

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            doctor.json
            privacy_scan.json
            light_effect_validation.json
            wheel_audit.json
            ci_output/
          if-no-files-found: ignore

  optional-dlib:
    name: Optional dlib backend / Ubuntu / Python 3.12
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk cmake
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,face-dlib]"
      - run: pytest tests/test_face_detection.py tests/test_face_backends.py
      - run: color-palette-doctor --output dlib_doctor.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optional-dlib-diagnostics
          path: dlib_doctor.json
          if-no-files-found: ignore
