name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Windows hosted runners redirect Python stdout through cp1252 by default.
  # Every official command emits Chinese, so keep the full workflow on UTF-8.
  PYTHONUTF8: "1"

jobs:
  core:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install minimal privacy-scan dependency
        run: python -m pip install --upgrade pip "Pillow>=10.0"

      - name: Privacy scan of checkout
        env:
          PYTHONPATH: src
        run: python tools/privacy_scan.py . --output privacy_scan.json

      - name: Install CJK font on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Compile Python source
        run: python -m compileall -q src tests tools

      - name: Verify OpenCV 4.x compatibility contract
        run: >-
          python -c "import cv2;
          major=int(cv2.__version__.split('.')[0]);
          print('OpenCV', cv2.__version__);
          assert major==4, f'V0.12.0 requires OpenCV 4.x, got {cv2.__version__}'"

      - name: Validate JSON Schema
        run: python tools/validate_schemas.py .

      - name: Run pytest
        run: python -m pytest

      - name: Privacy scan after tests
        run: python tools/privacy_scan.py . --output privacy_scan.json

      - name: Run local environment doctor
        run: color-palette-doctor --output doctor.json

      - name: Validate light/effect public dataset
        run: >-
          python tools/validate_light_effect_dataset.py
          --root .
          --output light_effect_validation.json

      - name: Build wheel
        run: python -m build --wheel

      - name: Audit built wheel
        run: >-
          python tools/audit_wheel.py dist
          --expected-version 0.12.0
          --output wheel_audit.json

      - name: Clean virtual environment Wheel install and CLI smoke
        run: >-
          python tools/clean_wheel_smoke.py dist
          --input examples/public/synthetic_srgb_icc.png
          --schema schemas/analysis.schema.json
          --output ci_output
          --result clean_wheel_smoke.json

      - name: Verify tracked files unchanged
        run: git diff --exit-code

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            doctor.json
            privacy_scan.json
            light_effect_validation.json
            wheel_audit.json
            clean_wheel_smoke.json
            ci_output/
          if-no-files-found: ignore

  optional-dlib:
    name: Optional dlib backend / Ubuntu / Python 3.12
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk cmake
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,face-dlib]"
      - run: pytest tests/test_face_detection.py tests/test_face_backends.py
      - run: color-palette-doctor --output dlib_doctor.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optional-dlib-diagnostics
          path: dlib_doctor.json
          if-no-files-found: ignore
