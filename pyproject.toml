[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "color-palette-skill"
version = "0.12.0"
description = "本地、零Token的中文照片色彩分析报告工具。"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Color Palette Skill Contributors"}]
dependencies = [
  "Pillow>=10.0",
  "numpy>=1.26",
  "opencv-python-headless>=4.14,<5",
  "scikit-image>=0.22",
  "scikit-learn>=1.4"
]

[project.optional-dependencies]
face-dlib = ["dlib>=19.24"]
dev = ["pytest>=8", "jsonschema>=4.21", "build>=1.2"]

[project.scripts]
color-palette = "color_palette.cli:main"
color-palette-golden = "color_palette.golden_cli:main"
color-palette-doctor = "color_palette.doctor:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
